<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f8a5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Comparando precios</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icono.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icono.svg" />
  <link rel="stylesheet" href="../comun/estilos.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .barra {
      background: var(--verde);
      color: #fff;
      padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .barra h1 { font-size: 1.15rem; }
    .barra .estado {
      margin-left: auto;
      font-size: 0.78rem;
      opacity: 0.9;
    }

    main {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 16px 16px 32px;
      display: grid;
      gap: 16px;
    }

    .pie {
      text-align: center;
      color: var(--gris);
      font-size: 0.82rem;
      padding-bottom: 20px;
    }
    .pie a { color: var(--verde); }
  </style>
</head>
<body>
  <header class="barra">
    <span aria-hidden="true">🏷️</span>
    <h1>Comparando precios</h1>
    <span class="estado" id="estado"></span>
  </header>

  <main id="cp-raiz"></main>

  <p class="pie">
    Funciona sin internet ·
    <a href="../web/ofertas.html">Ofertas</a> ·
    <a href="../web/">Página web</a>
  </p>

  <script src="../comun/comparador.js"></script>
  <script src="../comun/interfaz.js"></script>
  <script>
    Comparador.definirMoneda("$");
    Interfaz.montar({ raiz: "#cp-raiz", clave: "comparando-precios-app" });

    /* Conexión: solo informativo, la app no necesita internet. */
    var estado = document.getElementById("estado");
    function pintarEstado() {
      estado.textContent = navigator.onLine ? "" : "Sin conexión";
    }
    window.addEventListener("online", pintarEstado);
    window.addEventListener("offline", pintarEstado);
    pintarEstado();

    /* El service worker vive en la carpeta del proyecto para poder
       guardar también los archivos compartidos de ../comun/. */
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("../sw.js", { scope: "../" })
          .catch(function () { /* sin caché offline, la app igual funciona */ });
      });
    }
  </script>
</body>
</html>
