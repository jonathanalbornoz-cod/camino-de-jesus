<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="High Smile">
  <title>High Smile</title>
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
    <!-- Asta izquierda de la H -->
    <path d="M22 14 V86" />
    <!-- Travesaño -->
    <path d="M22 50 H63" />
    <!-- Asta derecha, que se funde con la S -->
    <path d="M63 34 V86" />
    <!-- Curva superior de la S -->
    <path d="M63 14 H45 a13 13 0 0 0 0 26" />
    <!-- Curva inferior de la S -->
    <path d="M40 86 h18 a13 13 0 0 0 0 -26" />
  </g>
</svg>
