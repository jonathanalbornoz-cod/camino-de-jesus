<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Página no encontrada</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // GitHub Pages no soporta reescrituras tipo .htaccess: reenviamos las rutas
  // profundas de la SPA (/agroforestal/catalogo, /agroforestal/blog/3, ...)
  // a su index.html conservando la ruta en el parámetro ?spa=
  (function () {
    var marker = '/agroforestal/';
    var path = location.pathname;
    var i = path.indexOf(marker);
    if (i >= 0) {
      var root = path.slice(0, i + marker.length);
      var rest = path.slice(i + marker.length);
      var query = location.search.replace('?', '&');
      location.replace(root + '?spa=' + encodeURIComponent(rest) + query + location.hash);
    }
  })();
</script>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f8f8f8; color:#1f2937; }
  main { text-align:center; padding:2rem; }
  h1 { font-size:3rem; margin:0 0 .5rem; color:#F36821; }
  a { color:#F36821; }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>La página que buscas no existe.</p>
    <p><a href="/">Volver al inicio</a></p>
  </main>
</body>
</html>
