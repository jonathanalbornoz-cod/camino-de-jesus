const base = location.href.replace(/revision\.html.*$/, '');

// Lo primero que hay que saber no es qué archivos hay, sino cómo se está viendo
// la portada de verdad. Se abre en un marco oculto y se mira desde dentro.
const VERSION_ESPERADA = '2026-10-20-3';

(function diagnosticarPortada() {
  const caja = document.getElementById('estilos');
  const pinta = h => caja.innerHTML = '<h2>Cómo se está viendo la portada</h2>' + h;

  const marco = document.createElement('iframe');
  marco.style.cssText = 'position:absolute;left:-9999px;width:1280px;height:900px;border:0';
  marco.src = base + '?revision=' + Date.now();
  document.body.appendChild(marco);

  const fallo = setTimeout(() => pinta('<p class="veredicto mal">La portada no respondió en 25 segundos.</p>'), 25000);

  marco.onload = () => setTimeout(() => {
    clearTimeout(fallo);
    let d;
    try { d = marco.contentDocument; } catch (e) {
      return pinta('<p class="veredicto mal">No se pudo mirar la portada: ' + e.message + '</p>');
    }
    const w = marco.contentWindow;
    const img = d.querySelector('header img, nav img');
    const caja2 = img && img.getBoundingClientRect();
    const ancho = caja2 ? Math.round(caja2.width) : 0;
    const reglas = [...d.styleSheets].reduce((n, s) => {
      try { return n + (s.media.mediaText === 'print' ? 0 : s.cssRules.length); } catch (e) { return n; }
    }, 0);
    const version = w.__AGRO_VERSION || null;
    const incrustado = !!d.querySelector('style[data-hoja]');
    const rescatado = !!d.querySelector('style[data-rescate]');

    const conDiseño = reglas > 300 && ancho > 0 && ancho < 400;

    let ficha = '<p>' + reglas + ' reglas de estilo activas · logotipo dibujado a ' + ancho + ' px de ancho' +
                (ancho > 400 ? ' (debería rondar los 264)' : '') + '</p>' +
                '<p>Estilos dentro de la página: <b>' + (incrustado ? 'sí' : 'no') + '</b>' +
                (rescatado ? ' · rescatados por ajustes.js' : '') + '</p>' +
                '<p>Versión de <code>ajustes.js</code> que sirve el servidor: <b>' +
                (version || 'ninguna — es una copia antigua') + '</b>' +
                (version === VERSION_ESPERADA ? ' (al día)' : ' · la de esta revisión es ' + VERSION_ESPERADA) + '</p>';

    if (conDiseño) {
      pinta('<p class="veredicto ok">La portada se está viendo con su diseño.</p>' + ficha +
            '<p>Si tú la ves sin diseño, tu navegador tiene guardada una copia vieja: ' +
            'ábrela con <b>Ctrl+F5</b>, o en una ventana de incógnito.</p>');
    } else if (version !== VERSION_ESPERADA) {
      pinta('<p class="veredicto mal">La portada sale sin diseño, y el servidor tiene archivos viejos.</p>' + ficha +
            '<p><b>Qué pasa:</b> no es el navegador, es el servidor: está entregando una copia ' +
            'anterior. <b>Solución:</b> sube otra vez <code>arreglo-rapido.zip</code> a ' +
            '<code>public_html</code> y asegúrate de <b>sobrescribir</b> al extraer. Si el extractor ' +
            'pregunta, responde que sí a reemplazar.</p>');
    } else {
      pinta('<p class="veredicto mal">La portada sale sin diseño, aunque los archivos están al día.</p>' + ficha +
            '<p>Esto ya no es ni el navegador ni una copia vieja. Pulsa «Revisar los 558 archivos» ' +
            'aquí abajo y pásame el resultado.</p>');
    }
    marco.remove();
  }, 4000);
})();

document.getElementById('ir').onclick = async function () {
  this.disabled = true; this.textContent = 'Revisando…';
  const barra = document.getElementById('barra'), relleno = barra.firstElementChild;
  const avance = document.getElementById('avance'), salida = document.getElementById('salida');
  barra.style.display = 'block'; salida.innerHTML = '';

  const malos = []; let hechos = 0;
  const cola = MANIFIESTO.slice();
  async function obrero() {
    while (cola.length) {
      const [ruta, tam] = cola.shift();
      const r = await revisar(ruta, tam);
      if (r.estado !== 'ok') malos.push({ ruta, ...r });
      hechos++;
      relleno.style.width = (hechos / MANIFIESTO.length * 100) + '%';
      avance.textContent = hechos + ' de ' + MANIFIESTO.length + ' comprobados · ' +
                           malos.length + ' con problema';
    }
  }
  await Promise.all(Array.from({ length: 10 }, obrero));

  const faltan = malos.filter(m => m.estado === 'falta');
  const clave = faltan.filter(m => !m.ruta.startsWith('storage/products/'));
  const fotos = faltan.filter(m => m.ruta.startsWith('storage/products/'));

  let h = '<div class="tarjeta"><div class="resumen">' +
    '<div><b>' + MANIFIESTO.length + '</b>archivos esperados</div>' +
    '<div><b class="' + (malos.length ? 'mal' : 'ok') + '">' + malos.length + '</b>con problema</div>' +
    '<div><b>' + (MANIFIESTO.length - malos.length) + '</b>correctos</div></div>';

  if (!malos.length) {
    h += '<p class="veredicto ok">Está todo. El sitio tiene los 558 archivos.</p>' +
         '<p>Si aun así se ve mal, es la caché del navegador: abre la portada con Ctrl+F5.</p>';
  } else {
    h += '<p class="veredicto mal">Faltan archivos en el servidor.</p>';
    if (clave.length)
      h += '<p>' + clave.length + ' archivo(s) esenciales del sitio. Sin ellos la página se ve sin ' +
           'diseño o a medias. <b>Solución:</b> vuelve a extraer <code>parte1-sitio.zip</code> ' +
           '(o sube la carpeta suelta) en <code>public_html</code>.</p><ul>' +
           clave.slice(0, 60).map(m => '<li>' + m.ruta + ' — ' + m.nota + '</li>').join('') +
           (clave.length > 60 ? '<li>…y ' + (clave.length - 60) + ' más</li>' : '') + '</ul>';
    if (fotos.length)
      h += '<p>' + fotos.length + ' foto(s) de producto. <b>Solución:</b> vuelve a extraer ' +
           '<code>parte2-productos.zip</code> y <code>parte3-productos.zip</code>.</p>';
    const otros = malos.filter(m => m.estado === 'distinto');
    if (otros.length)
      h += '<p>' + otros.length + ' archivo(s) llegaron incompletos o con otro contenido.</p><ul>' +
           otros.slice(0, 30).map(m => '<li>' + m.ruta + ' — ' + m.nota + '</li>').join('') + '</ul>';
    h += '<p>Copia esto y pásamelo si quieres que lo mire:</p><textarea readonly>' +
         malos.map(m => m.ruta + ' — ' + m.nota).join('\n') + '</textarea>';
  }
  salida.innerHTML = h + '</div>';
  this.textContent = 'Revisar otra vez'; this.disabled = false;
};
</script>
