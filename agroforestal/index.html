  <!-- Base dinamica: el sitio funciona igual en la raiz de un dominio propio
       (agroforestaldecolombia.com), en la raiz de un repositorio de GitHub Pages
       (usuario.github.io/repositorio/) y dentro de una subcarpeta. -->
  <script>
    (function () {
      var path = location.pathname;
      var marca = '/agroforestal/';
      var i = path.indexOf(marca);
      var esPages = /\.github\.io$/i.test(location.hostname);
      var primero = path.split('/')[1] || '';
      var root;
      if (i >= 0) {
        root = path.slice(0, i + marca.length);            // subcarpeta dentro de otro repositorio
      } else if (esPages && primero) {
        root = '/' + primero + '/';                        // Pages de proyecto: /<repositorio>/...
      } else if (path === '' || /\/$/.test(path)) {
        root = path || '/';                                // la propia carpeta
      } else if (/\.[a-z0-9]+$/i.test(path)) {
        root = path.replace(/[^/]*$/, '');                 // .../index.html
      } else {
        root = '/';                                        // dominio propio, ruta profunda
      }
      var base = document.createElement('base');
      base.setAttribute('href', root);
      document.head.insertBefore(base, document.head.firstChild);

      // Rutas profundas redirigidas por 404.html (GitHub Pages no reescribe como .htaccess)
      var m = location.search.match(/[?&]spa=([^&]*)/);
      if (m) {
        var rest = decodeURIComponent(m[1]);
        var rem = location.search.replace(/[?&]spa=[^&]*/, '').replace(/^&/, '?');
        history.replaceState(null, '', root + rest + (rem === '?' ? '' : rem) + location.hash);
      }
    })();
  </script>
